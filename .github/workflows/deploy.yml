name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository (to copy docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/aerocare/"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,BACKEND_IMAGE_NAME,FRONTEND_IMAGE_NAME
          script: |
            set -e

            # Create project directory
            mkdir -p ~/aerocare
            cd ~/aerocare

            # Log in to GHCR on the EC2 instance
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Setup environment variables for docker-compose
            BACKEND_IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:main" | tr '[:upper:]' '[:lower:]')
            FRONTEND_IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:main" | tr '[:upper:]' '[:lower:]')

            if [ "${{ github.ref_name }}" = "master" ]; then
              BACKEND_IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:master" | tr '[:upper:]' '[:lower:]')
              FRONTEND_IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:master" | tr '[:upper:]' '[:lower:]')
            fi

            export BACKEND_IMAGE=$BACKEND_IMAGE_LOWER
            export FRONTEND_IMAGE=$FRONTEND_IMAGE_LOWER

            # Write env file inside backend/ on the host
            mkdir -p backend
            echo "HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}" > backend/.env
            echo "HF_MODEL_ID=Qwen/Qwen2.5-72B-Instruct" >> backend/.env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> backend/.env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> backend/.env

            # Detect which Docker Compose command is available
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Error: neither 'docker compose' nor 'docker-compose' is installed on the EC2 server!"
              exit 1
            fi

            # Make sure Docker Compose pulls the latest images and recreates containers
            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d --remove-orphans

            # Clean up old dangling images
            docker image prune -f
